<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
</head>
<body>
    <header>
    <h1 class="title">Snake Game</h1>
    </header>
    <main>
    <div class="hud">
      <div class="hud-block">
        <span class="hud-label">Score</span>
        <span id="score" class="hud-value">0</span>
      </div>
      <div class="hud-block">
        <span class="hud-label">Status</span>
        <span id="status" class="hud-value">Idle</span>
      </div>
      <button id="restart" class="restart-btn" type="button">Restart</button>
    </div>

    <div class="board-frame">
      <canvas id="board"></canvas>
      <div id="overlay" class="overlay"></div>
    </div>

    <p class="hint">Arrow keys / WASD to move &middot; Space to pause</p>
    </main>
    <footer class="legend">
      <p>
        Instructions: Use the arrow keys to move the snake.
      </p>
    </footer>
    <script src="src/main.js"></script>
</body>
</html>
